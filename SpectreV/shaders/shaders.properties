# ============================================================================
#  SpectreV  -  shaders.properties
#  Controls the in-game shader options menu (Iris / OptiFine) and a few
#  pipeline-wide rendering flags. The actual default VALUES live in
#  lib/settings.glsl; here we just expose them as menu controls and lay out
#  the screen.
# ============================================================================

# ---- Pipeline flags --------------------------------------------------------
shadowMapResolution=2048
shadowDistance=160.0
# Sun/moon path uses the standard celestial angle; keep shadows following sun.

# ---- Custom uniforms / hardware -------------------------------------------
# Enable coloured shadows (needs shadowcolor0) and the depth copies we sample.
shadow.enabled=true

# ---- Screen layout ---------------------------------------------------------
# Top-level menu
screen = [SHADOWS] [SKY_SUN] <empty> [VOLUMETRICS] [WATER] <empty> [POST] [PERFORMANCE]

# Group: Shadows
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_BIAS SHADOW_BRIGHTNESS

# Group: Sky & Sun
screen.SKY_SUN = SUN_INTENSITY SKY_INTENSITY GOLDEN_HOUR_WARMTH NIGHT_BRIGHTNESS

# Group: Volumetrics (god rays + clouds)
screen.VOLUMETRICS = GODRAYS GODRAY_SAMPLES GODRAY_INTENSITY <empty> VOLUMETRIC_CLOUDS CLOUD_STEPS CLOUD_DENSITY CLOUD_SPEED CLOUD_SCATTER

# Group: Water
screen.WATER = WATER_REFLECTIONS SSR_STEPS WATER_CAUSTICS WATER_WAVE_HEIGHT WATER_FRESNEL_POW

# Group: Post processing
screen.POST = TONEMAP_ACES EXPOSURE CONTRAST SATURATION COLOR_TEMP LIFT <empty> BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD <empty> VIGNETTE FILM_GRAIN

# Group: Performance (the GPU-heavy knobs in one place)
screen.PERFORMANCE = SSAO SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH <empty> GODRAY_SAMPLES CLOUD_STEPS SSR_STEPS SHADOW_SAMPLES

# ---- Slider definitions (which options render as sliders) ------------------
sliders = SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_BIAS SHADOW_BRIGHTNESS \
          SUN_INTENSITY SKY_INTENSITY GOLDEN_HOUR_WARMTH NIGHT_BRIGHTNESS \
          GODRAY_SAMPLES GODRAY_INTENSITY CLOUD_STEPS CLOUD_DENSITY CLOUD_SPEED CLOUD_SCATTER \
          SSR_STEPS WATER_WAVE_HEIGHT WATER_FRESNEL_POW \
          SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH \
          EXPOSURE CONTRAST SATURATION COLOR_TEMP LIFT \
          BLOOM_STRENGTH BLOOM_THRESHOLD VIGNETTE FILM_GRAIN \
          shadowMapResolution shadowDistance

# ---- Profiles (quick quality presets) -------------------------------------
profile.POTATO  = SSAO=false GODRAYS=false VOLUMETRIC_CLOUDS=false WATER_REFLECTIONS=false BLOOM=false SHADOW_SAMPLES=1 shadowMapResolution=1024
profile.BALANCED= SSAO=true  GODRAYS=true  VOLUMETRIC_CLOUDS=true  WATER_REFLECTIONS=true  BLOOM=true  SHADOW_SAMPLES=2 shadowMapResolution=2048 CLOUD_STEPS=16 GODRAY_SAMPLES=16
profile.ULTRA   = SSAO=true  GODRAYS=true  VOLUMETRIC_CLOUDS=true  WATER_REFLECTIONS=true  BLOOM=true  SHADOW_SAMPLES=3 shadowMapResolution=4096 CLOUD_STEPS=32 GODRAY_SAMPLES=32 SSR_STEPS=40 SSAO_SAMPLES=24

profileList = POTATO BALANCED ULTRA
