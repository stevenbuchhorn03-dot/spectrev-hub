  <text x="26" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff">M</text>
  <!-- Wordmark -->
  <text x="66" y="28" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#14201a" letter-spacing="-0.4">Faktor<tspan fill="#0e7c4a"> M</tspan></text>
  <text x="67" y="46" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#5a6b62" letter-spacing="3.2">PERSONALBERATUNG</text>
